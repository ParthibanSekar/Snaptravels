{% extends "layouts/base.html" %}
{% block title %}Add Traveler — SnapTravels{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:600px">
  <h2 class="fw-bold mb-4"><i class="bi bi-person-plus"></i> Add Traveler Profile</h2>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" min="0" max="120">
          </div>
          <div class="col-md-6">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select">
              <option value="">Select</option>
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Date of Birth</label>
          <input type="date" name="date_of_birth" class="form-control" min="1920-01-01">
        </div>
        <div class="mb-3">
          <label class="form-label">Nationality</label>
          <input type="text" name="nationality" class="form-control" value="Indian">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label">ID Type</label>
            <select name="id_type" class="form-select">
              <option value="">None</option>
              <option>Aadhaar</option><option>PAN</option>
              <option>Voter ID</option><option>Driving License</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">ID Number</label>
            <input type="text" name="id_number" class="form-control">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Passport Number</label>
          <input type="text" name="passport_no" class="form-control" placeholder="For international travel">
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="is_primary" id="isPrimary">
          <label class="form-check-label" for="isPrimary">Set as primary traveler</label>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Save Traveler</button>
          <a href="{{ url_for('user.travelers') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
