
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SnapTravels - Authentication{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100">
        <div class="row w-100">
            <div class="col-md-6 col-lg-4 mx-auto">
                <div class="auth-card p-5">
                    <div class="text-center mb-4">
                        <h2 class="text-primary">
                            <i class="bi bi-airplane"></i> SnapTravels
                        </h2>
                        <p class="text-muted">Your Travel Companion</p>
                    </div>

                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Toast Notifications -->
    <div id="snap-toast-container" aria-live="polite"></div>
    <style>
    #snap-toast-container { position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:340px;width:calc(100vw - 40px);pointer-events:none; }
    .snap-toast { pointer-events:all;display:flex;align-items:flex-start;gap:12px;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,.55);animation:toastIn .3s cubic-bezier(.175,.885,.32,1.1) both;position:relative;overflow:hidden; }
    .snap-toast.toast-out { animation:toastOut .25s ease-in forwards; }
    @keyframes toastIn  { from{opacity:0;transform:translateX(120%) scale(.92)}to{opacity:1;transform:translateX(0) scale(1)} }
    @keyframes toastOut { from{opacity:1;transform:translateX(0) scale(1);max-height:120px}to{opacity:0;transform:translateX(80%) scale(.92);max-height:0} }
    .snap-toast-icon { width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0; }
    .snap-toast-body { flex:1;min-width:0; }
    .snap-toast-title { font-size:.8rem;font-weight:700;margin-bottom:2px; }
    .snap-toast-msg { font-size:.8rem;line-height:1.45;color:#94a3b8; }
    .snap-toast-close { background:none;border:none;cursor:pointer;color:#475569;font-size:.85rem;padding:2px 4px;flex-shrink:0;transition:color .15s; }
    .snap-toast-close:hover { color:#e2e8f0; }
    .snap-toast-bar { position:absolute;bottom:0;left:0;height:3px;border-radius:0 0 12px 12px;animation:toastBar linear forwards; }
    @keyframes toastBar { from{width:100%}to{width:0%} }
    .toast-success { border-left:3px solid #10b981; } .toast-success .snap-toast-icon{background:rgba(16,185,129,.15);color:#10b981} .toast-success .snap-toast-title{color:#34d399} .toast-success .snap-toast-bar{background:#10b981}
    .toast-warning { border-left:3px solid #f59e0b; } .toast-warning .snap-toast-icon{background:rgba(245,158,11,.15);color:#f59e0b} .toast-warning .snap-toast-title{color:#fbbf24} .toast-warning .snap-toast-bar{background:#f59e0b}
    .toast-danger  { border-left:3px solid #ef4444; } .toast-danger  .snap-toast-icon{background:rgba(239,68,68,.15);color:#ef4444}  .toast-danger  .snap-toast-title{color:#f87171} .toast-danger  .snap-toast-bar{background:#ef4444}
    .toast-info    { border-left:3px solid #3b82f6; } .toast-info    .snap-toast-icon{background:rgba(96,165,250,.15);color:#60a5fa}  .toast-info    .snap-toast-title{color:#93c5fd} .toast-info    .snap-toast-bar{background:#60a5fa}
    </style>
    <script>
    (function(){
      var ICONS={success:'bi-check-circle-fill',warning:'bi-exclamation-triangle-fill',danger:'bi-x-circle-fill',error:'bi-x-circle-fill',info:'bi-info-circle-fill'};
      var TITLES={success:'Success',warning:'Warning',danger:'Error',error:'Error',info:'Info'};
      var D=4500;
      function show(cat,msg){
        var type=cat==='error'?'danger':cat;
        if(!['success','warning','danger','info'].includes(type))type='info';
        var el=document.createElement('div');
        el.className='snap-toast toast-'+type;
        el.setAttribute('role','alert');
        el.innerHTML='<div class="snap-toast-icon"><i class="bi '+(ICONS[type]||'bi-bell-fill')+'"></i></div>'
          +'<div class="snap-toast-body"><div class="snap-toast-title">'+(TITLES[type]||'Notice')+'</div>'
          +'<div class="snap-toast-msg">'+msg+'</div></div>'
          +'<button class="snap-toast-close" onclick="snapDismissToast(this.closest(\'.snap-toast\'))"><i class="bi bi-x-lg"></i></button>'
          +'<div class="snap-toast-bar" style="animation-duration:'+D+'ms"></div>';
        document.getElementById('snap-toast-container').appendChild(el);
        setTimeout(function(){snapDismissToast(el);},D);
      }
      window.snapDismissToast=function(el){if(!el||el.classList.contains('toast-out'))return;el.classList.add('toast-out');setTimeout(function(){el&&el.remove();},280);};
      window.snapToast=show;
      var msgs={{ get_flashed_messages(with_categories=true)|tojson }};
      document.addEventListener('DOMContentLoaded',function(){msgs.forEach(function(m){show(m[0],m[1]);});});
    })();
    </script>
</body>
</html>
