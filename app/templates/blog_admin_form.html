{% extends "layouts/base.html" %}
{% block title %}{{ 'Edit' if post else 'New' }} Blog Post — Admin{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:900px">
  <h2 class="fw-bold mb-4">{{ 'Edit' if post else 'New' }} Travel Guide</h2>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
          <label class="form-label">Title *</label>
          <input type="text" name="title" class="form-control" value="{{ post.title if post else '' }}" required>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label">Destination</label>
            <input type="text" name="destination" class="form-control"
                   value="{{ post.destination if post else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
              {% for cat in ['Guide','Tips','News','Deals','Adventure','Culture','Food'] %}
              <option value="{{ cat }}" {{ 'selected' if post and post.category == cat else '' }}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Excerpt (short summary)</label>
          <textarea name="excerpt" class="form-control" rows="2">{{ post.excerpt if post else '' }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Content (HTML supported)</label>
          <textarea name="content" class="form-control" rows="15">{{ post.content if post else '' }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Featured Image URL</label>
          <input type="text" name="featured_image" class="form-control"
                 value="{{ post.featured_image if post else '' }}">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label">Author</label>
            <input type="text" name="author" class="form-control"
                   value="{{ post.author if post else 'SnapTravels Team' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Tags (comma separated)</label>
            <input type="text" name="tags" class="form-control"
                   value="{{ post.tags|join(', ') if post else '' }}"
                   placeholder="goa, beaches, monsoon">
          </div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="published" id="published"
                 {{ 'checked' if post and post.published else '' }}>
          <label class="form-check-label" for="published">Publish immediately</label>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle me-1"></i> {{ 'Save Changes' if post else 'Create Post' }}
          </button>
          <a href="{{ url_for('blog.listing') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
