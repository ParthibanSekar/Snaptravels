<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { margin:0; padding:20px; font-family:-apple-system,'Inter',sans-serif; background:#fff; }
h3 { font-size:.95rem; font-weight:800; color:#0f172a; margin:0 0 4px; }
.desc { font-size:.75rem; color:#6b7280; margin-bottom:16px; line-height:1.6; }
.action-btn {
  display:inline-flex; align-items:center; gap:8px;
  padding:12px 22px; border-radius:10px; font-weight:700; font-size:.85rem;
  border:none; cursor:pointer; transition:all .2s;
  background:linear-gradient(135deg,#db2777,#ec4899); color:#fff;
  box-shadow:0 4px 14px rgba(219,39,119,.3);
}
.action-btn:hover { transform:translateY(-2px); filter:brightness(1.05); }
.popup-tag { font-size:.6rem; background:rgba(255,255,255,.2); padding:2px 6px; border-radius:4px; }
.result { display:none; background:#fdf2f8; border:1px solid #fbcfe8; border-radius:10px; padding:10px 16px; font-size:.82rem; color:#9d174d; font-weight:600; margin-top:12px; }
.skip-btn { display:inline-flex; align-items:center; gap:4px; background:#f3f4f6; color:#374151; border:none; border-radius:8px; padding:8px 16px; font-size:.78rem; font-weight:600; cursor:pointer; margin-top:14px; }
</style>
</head>
<body>
<h3><i class="bi bi-bell" style="color:#db2777;margin-right:6px"></i>Set Price Alert</h3>
<div class="desc">Opens a <strong>popup form</strong> where you fill in alert details. On submit, the data is sent back via <code>postMessage</code>.</div>
<button class="action-btn" onclick="parent.postMessage({type:'open_price_alert'},'*')">
  <i class="bi bi-bell"></i>Set Price Alert <span class="popup-tag">POPUP FORM</span>
</button>
<div class="result" id="result"><i class="bi bi-bell-fill me-1"></i><span id="resultText"></span></div>
<br>
<button class="skip-btn" onclick="parent.postMessage({type:'skip_to_step',step:4},'*')">Skip / Next Step <i class="bi bi-arrow-right"></i></button>

<script>
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'price_alert_set') {
    document.getElementById('result').style.display = '';
    document.getElementById('resultText').textContent = 'Alert set for ' + e.data.destination + ' under ' + e.data.price;
  }
});
</script>
</body>
</html>
