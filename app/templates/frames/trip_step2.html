<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { margin:0; padding:20px; font-family:-apple-system,'Inter',sans-serif; background:#fff; }
h3 { font-size:.95rem; font-weight:800; color:#0f172a; margin:0 0 4px; }
.desc { font-size:.75rem; color:#6b7280; margin-bottom:16px; line-height:1.6; }
.action-btn {
  display:inline-flex; align-items:center; gap:8px;
  padding:12px 22px; border-radius:10px; font-weight:700; font-size:.85rem;
  border:none; cursor:pointer; transition:all .2s;
  background:linear-gradient(135deg,#1d4ed8,#3b82f6); color:#fff;
  box-shadow:0 4px 14px rgba(29,78,216,.3);
}
.action-btn:hover { transform:translateY(-2px); filter:brightness(1.05); }
.popup-tag { font-size:.6rem; background:rgba(255,255,255,.2); padding:2px 6px; border-radius:4px; }
.result { display:none; background:#f0fdf4; border:1px solid #86efac; border-radius:10px; padding:10px 16px; font-size:.82rem; color:#166534; font-weight:600; margin-top:12px; }
.skip-btn { display:inline-flex; align-items:center; gap:4px; background:#f3f4f6; color:#374151; border:none; border-radius:8px; padding:8px 16px; font-size:.78rem; font-weight:600; cursor:pointer; margin-top:14px; }
</style>
</head>
<body>
<h3><i class="bi bi-window-stack" style="color:#1d4ed8;margin-right:6px"></i>Compare Flights</h3>
<div class="desc">Opens a <strong>popup window with two frames</strong> — flight list on top, action bar on bottom. Select a flight and confirm to send the choice back.</div>
<button class="action-btn" onclick="parent.postMessage({type:'open_compare_popup'},'*')">
  <i class="bi bi-window-stack"></i>Open Flight Comparison <span class="popup-tag">FRAMESET POPUP</span>
</button>
<div class="result" id="result"><i class="bi bi-check-circle-fill me-1"></i><span id="resultText"></span></div>
<br>
<button class="skip-btn" onclick="parent.postMessage({type:'skip_to_step',step:2},'*')">Skip / Next Step <i class="bi bi-arrow-right"></i></button>

<script>
window.addEventListener('message', function(e) {
  if (e.origin !== window.location.origin) return;
  if (e.data && e.data.type === 'flight_selected') {
    document.getElementById('result').style.display = '';
    document.getElementById('resultText').textContent = e.data.flight + ' selected from popup';
  }
});
</script>
</body>
</html>
