<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set Price Alert — {{ destination }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#fdf2f8; font-family:-apple-system,'Inter',sans-serif; padding:20px; margin:0; }
.header { background:linear-gradient(135deg,#db2777,#ec4899); color:#fff; border-radius:12px; padding:16px 20px; margin-bottom:20px; }
.form-card { background:#fff; border-radius:12px; padding:22px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
.form-label { font-weight:600; font-size:.82rem; color:#374151; margin-bottom:4px; }
.form-control, .form-select { border-radius:8px; border:1.5px solid #e5e7eb; padding:10px 14px; font-size:.88rem; }
.form-control:focus { border-color:#ec4899; box-shadow:0 0 0 3px rgba(236,72,153,.12); outline:none; }
</style>
</head>
<body>

<div class="header">
  <div style="font-weight:800;font-size:.95rem"><i class="bi bi-bell-fill" style="margin-right:6px">&#x1F514;</i> Set Price Alert</div>
  <div style="font-size:.78rem;opacity:.85">Get notified when prices drop for {{ destination }}</div>
</div>

<div class="form-card">
  <div class="mb-3">
    <label class="form-label">Destination</label>
    <input type="text" class="form-control" value="{{ destination }}" id="destInput">
  </div>
  <div class="mb-3">
    <label class="form-label">Alert me when price is below</label>
    <div style="position:relative">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:#374151">₹</span>
      <input type="number" class="form-control" style="padding-left:30px" value="5000" id="priceInput" min="500" step="500">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" placeholder="your@email.com" id="emailInput">
  </div>
  <div class="mb-3">
    <label class="form-label">Travel Date (flexible)</label>
    <input type="date" class="form-control" id="dateInput">
  </div>
  <button onclick="setAlert()"
          style="width:100%;background:linear-gradient(135deg,#db2777,#ec4899);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:.9rem;cursor:pointer">
    Set Alert & Close
  </button>
</div>

<script>
function setAlert() {
  var dest = document.getElementById('destInput').value;
  var price = '₹' + document.getElementById('priceInput').value;
  if (window.opener) {
    window.opener.postMessage({type:'price_alert_set', destination:dest, price:price}, '*');
    window.close();
  }
}
</script>
</body>
</html>
