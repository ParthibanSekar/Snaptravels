{% extends "layouts/base.html" %}
{% block title %}Plan New Trip — SnapTravels{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:600px">
  <h2 class="fw-bold mb-4"><i class="bi bi-map"></i> Plan a New Trip</h2>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
          <label class="form-label">Trip Name *</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Goa Trip 2026" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Primary Destination</label>
          <input type="text" name="destination" class="form-control" placeholder="e.g. Goa">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Start Date</label>
            <input type="date" name="start_date" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label">End Date</label>
            <input type="date" name="end_date" class="form-control">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="3" placeholder="Anything to remember…"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i> Create Trip
          </button>
          <a href="{{ url_for('trips.listing') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
const today = new Date().toISOString().split('T')[0];
document.querySelectorAll('input[type="date"]').forEach(i => i.min = today);
</script>
{% endblock %}
